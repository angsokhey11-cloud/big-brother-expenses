<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BIG BROTHER — Monthly Expense Mobile</title>
<link rel="stylesheet" href="mobile-monthly.css?v=20260916-5">
<script src="supabase-expenses-adapter.js?v=20260912-2"></script>
</head>
<body>
<main class="app">
  <header class="mobile-head">
    <div>
      <strong>Monthly Expense</strong>
      <span>Category totals · tap View Expenses to drill down</span>
    </div>
    <button id="topRefreshBtn" type="button" aria-label="Refresh">↻</button>
  </header>

  <section class="period-card">
    <button id="prevMonthBtn" class="nav-btn" type="button" aria-label="Previous month">‹</button>
    <label class="month-field">
      <span>Month</span>
      <input id="reportMonth" type="month">
    </label>
    <button id="nextMonthBtn" class="nav-btn" type="button" aria-label="Next month">›</button>
    <button id="refreshBtn" class="nav-btn" type="button" aria-label="Refresh">↻</button>
    <label class="zero-toggle">
      <input id="showZeroCategories" type="checkbox">
      <span>Show Zero Categories</span>
    </label>
  </section>

  <div id="errorBox" class="error-box" hidden></div>
  <div id="loadingBox" class="loading-box">Loading Monthly Expense…</div>

  <section class="kpi-grid" id="kpiGrid" hidden>
    <article class="kpi total"><small>Total Monthly Expense</small><strong id="monthlyTotal">$0.00</strong></article>
    <article class="kpi"><small>Operating Expense</small><strong id="operatingTotal">$0.00</strong></article>
    <article class="kpi"><small>Non-Operating Expense</small><strong id="nonOperatingTotal">$0.00</strong></article>
    <article class="kpi"><small>Capital Expense</small><strong id="capitalTotal">$0.00</strong></article>
    <article class="kpi"><small>Expense Records</small><strong id="recordCount">0</strong></article>
  </section>

  <section id="reportSections"></section>

  <section id="grandTotalCard" class="grand-total" hidden>
    <span>TOTAL MONTHLY EXPENSE</span>
    <strong id="grandTotal">$0.00</strong>
  </section>
  <div id="reportMeta" class="report-meta"></div>
</main>

<div id="categorySheet" class="sheet-overlay" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="categoryTitle">
    <header class="sheet-head">
      <div>
        <strong id="categoryTitle">Category Expenses</strong>
        <span id="categoryMeta"></span>
      </div>
      <button id="categoryCloseBtn" type="button" aria-label="Close">×</button>
    </header>
    <div id="categoryList" class="transaction-list"></div>
  </section>
</div>

<script src="mobile-monthly.js?v=20260916-5"></script>
</body>
</html>
